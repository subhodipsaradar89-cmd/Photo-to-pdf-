<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-3881245900857892">
<title>PixPDF — Premium Photo to PDF Converter</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3881245900857892" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #07070c;
    --bg2: #0d0d16;
    --card: rgba(255,255,255,0.035);
    --card-hover: rgba(255,255,255,0.055);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(168,85,247,0.4);
    --accent1: #6366f1;
    --accent2: #a855f7;
    --accent3: #ec4899;
    --accent-glow: rgba(139,92,246,0.5);
    --text: #f5f5fa;
    --muted: #8b8b9e;
    --muted2: #5a5a6e;
    --success: #22c55e;
    --error: #ef4444;
    --radius: 20px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ ANIMATED BACKGROUND ============ */
  .bg-orbs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.4;
    will-change: transform;
  }
  .orb-1 {
    width: 550px; height: 550px;
    background: radial-gradient(circle, #6366f1, transparent 70%);
    top: -250px; left: -180px;
    animation: drift1 18s ease-in-out infinite;
  }
  .orb-2 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #a855f7, transparent 70%);
    top: 30%; right: -200px;
    animation: drift2 22s ease-in-out infinite;
  }
  .orb-3 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #ec4899, transparent 70%);
    bottom: -180px; left: 30%;
    animation: drift3 20s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(120px,80px) scale(1.15); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-100px,60px) scale(1.1); }
  }
  @keyframes drift3 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(80px,-70px) scale(1.2); }
  }

  /* Subtle grain texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 24px 100px;
  }

  /* ============ NAV ============ */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 80px;
    animation: fadeDown 0.7s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo-icon {
    width: 42px; height: 42px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    background-size: 200% 200%;
    display: grid;
    place-items: center;
    box-shadow:
      0 8px 24px rgba(99,102,241,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
    animation: gradientShift 6s ease infinite;
  }
  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .logo-icon svg { width: 22px; height: 22px; }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    padding: 6px 12px;
    border-radius: 100px;
    background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(236,72,153,0.15));
    border: 1px solid rgba(168,85,247,0.3);
    color: #d8b4fe;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #d8b4fe;
    box-shadow: 0 0 8px #d8b4fe;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* ============ HERO ============ */
  .hero {
    text-align: center;
    margin-bottom: 56px;
    animation: fadeUp 0.8s cubic-bezier(0.4,0,0.2,1) 0.1s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 100px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
  }
  .hero-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }
  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.3rem, 6.5vw, 4rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 20px;
  }
  .hero h1 span {
    background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 4s ease infinite;
  }
  .hero p {
    color: var(--muted);
    font-size: clamp(0.98rem, 2.5vw, 1.15rem);
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.65;
  }

  /* ============ MAIN CARD ============ */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 32px;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.02),
      inset 0 1px 0 rgba(255,255,255,0.06);
    animation: fadeUp 0.8s cubic-bezier(0.4,0,0.2,1) 0.2s both;
  }

  /* ============ DROPZONE ============ */
  .dropzone {
    position: relative;
    border: 2px dashed rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 60px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    background: rgba(255,255,255,0.012);
    overflow: hidden;
  }
  .dropzone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(236,72,153,0.08));
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent2);
    transform: translateY(-2px);
    box-shadow: 0 20px 60px -20px var(--accent-glow);
  }
  .dropzone:hover::before, .dropzone.drag::before { opacity: 1; }
  .dropzone.drag { transform: scale(1.015); border-style: solid; }

  .dz-icon {
    position: relative;
    width: 82px; height: 82px;
    margin: 0 auto 24px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(236,72,153,0.22));
    border: 1px solid rgba(255,255,255,0.12);
    display: grid;
    place-items: center;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .dropzone:hover .dz-icon, .dropzone.drag .dz-icon {
    transform: translateY(-6px) scale(1.06);
    box-shadow:
      0 16px 40px -12px var(--accent-glow),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .dz-icon svg {
    width: 34px; height: 34px;
    stroke: #c084fc;
    filter: drop-shadow(0 0 10px rgba(192,132,252,0.5));
  }
  .dz-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .dz-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .dz-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 32px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: #fff;
    font-weight: 700;
    font-size: 0.94rem;
    box-shadow:
      0 12px 32px -8px rgba(99,102,241,0.7),
      inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
  }
  .dropzone:hover .dz-btn {
    transform: translateY(-2px);
    box-shadow:
      0 18px 40px -8px rgba(168,85,247,0.85),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .dz-btn svg { width: 17px; height: 17px; }

  input[type=file] { display: none; }

  /* ============ PREVIEW SECTION ============ */
  .preview-wrap {
    display: none;
    animation: fadeUp 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .preview-wrap.show { display: block; }

  .preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 32px 0 18px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .preview-head h3 {
    font-size: 1.05rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: -0.2px;
  }
  .count-pill {
    background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(168,85,247,0.2));
    color: #d8b4fe;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 100px;
    border: 1px solid rgba(168,85,247,0.3);
  }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .clear-btn:hover {
    color: #f87171;
    border-color: rgba(248,113,113,0.45);
    background: rgba(248,113,113,0.08);
  }
  .clear-btn svg { width: 14px; height: 14px; }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .thumb {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 1;
    background: #14141c;
    border: 1px solid var(--border);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1),
                box-shadow 0.3s,
                border-color 0.3s;
    animation: thumbIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    cursor: grab;
    user-select: none;
  }
  .thumb:active { cursor: grabbing; }
  @keyframes thumbIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  .thumb:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 44px -14px rgba(0,0,0,0.85);
    border-color: rgba(168,85,247,0.4);
  }
  .thumb.dragging {
    opacity: 0.4;
    transform: scale(0.95);
    cursor: grabbing;
  }
  .thumb.drop-target {
    border-color: var(--accent2);
    border-style: dashed;
    box-shadow: 0 0 0 3px rgba(168,85,247,0.25);
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .thumb .num {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 2;
  }
  .thumb .del {
    position: absolute;
    top: 8px; right: 8px;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 2;
    padding: 0;
  }
  .thumb .del svg { width: 13px; height: 13px; }
  .thumb:hover .del {
    opacity: 1;
    transform: scale(1);
  }
  .thumb .del:hover {
    background: #dc2626;
    transform: scale(1.1) rotate(90deg);
    border-color: #dc2626;
  }

  /* ============ OPTIONS ============ */
  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-top: 30px;
  }
  .opt label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 9px;
  }
  .opt label svg { width: 13px; height: 13px; opacity: 0.7; }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '';
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 8px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
    transition: transform 0.2s;
  }
  .opt select {
    width: 100%;
    padding: 13px 38px 13px 15px;
    border-radius: 12px;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    outline: none;
    transition: all 0.2s;
    cursor: pointer;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  .opt select:hover { background: rgba(255,255,255,0.07); }
  .opt select:focus {
    border-color: var(--accent2);
    background: rgba(168,85,247,0.1);
    box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
  }
  .opt select option { background: #16161f; color: #fff; }

  /* ============ CONVERT BUTTON ============ */
  .convert-wrap { position: relative; margin-top: 28px; }
  .convert {
    position: relative;
    width: 100%;
    padding: 19px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    background-size: 200% 200%;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.2px;
    font-family: inherit;
    box-shadow:
      0 20px 44px -14px rgba(139,92,246,0.85),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
  }
  .convert::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s;
  }
  .convert:hover:not(:disabled)::before { left: 100%; }
  .convert:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow:
      0 28px 56px -14px rgba(168,85,247,0.95),
      inset 0 1px 0 rgba(255,255,255,0.3);
    background-position: 100% 50%;
  }
  .convert:active:not(:disabled) { transform: translateY(-1px); }
  .convert:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }
  .convert svg { width: 20px; height: 20px; }

  /* Progress bar */
  .progress {
    position: absolute;
    left: 0; bottom: 0;
    height: 3px;
    width: 0%;
    background: linear-gradient(90deg, #fff, #c084fc);
    border-radius: 0 0 16px 16px;
    transition: width 0.3s ease;
    box-shadow: 0 0 12px #c084fc;
  }

  .spin {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ FEATURES ============ */
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
    margin-top: 64px;
    animation: fadeUp 0.8s cubic-bezier(0.4,0,0.2,1) 0.3s both;
  }
  .feat {
    position: relative;
    padding: 24px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.012));
    border: 1px solid var(--border);
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
  }
  .feat::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(99,102,241,0.06), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .feat:hover {
    transform: translateY(-6px);
    border-color: var(--border-hover);
    box-shadow: 0 22px 50px -20px var(--accent-glow);
  }
  .feat:hover::before { opacity: 1; }
  .feat .ic {
    position: relative;
    width: 44px; height: 44px;
    border-radius: 13px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(236,72,153,0.22));
    border: 1px solid rgba(255,255,255,0.08);
    display: grid;
    place-items: center;
    color: #c084fc;
  }
  .feat .ic svg { width: 20px; height: 20px; }
  .feat h4 {
    position: relative;
    font-size: 1rem;
    margin-bottom: 7px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .feat p {
    position: relative;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }

  /* ============ FOOTER ============ */
  footer {
    text-align: center;
    margin-top: 80px;
    color: var(--muted2);
    font-size: 0.85rem;
    animation: fadeUp 0.8s cubic-bezier(0.4,0,0.2,1) 0.4s both;
  }
  footer .heart { color: #ec4899; }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(140px);
    background: rgba(18,18,26,0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    padding: 15px 24px;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow:
      0 24px 60px -12px rgba(0,0,0,0.9),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 11px;
    max-width: calc(100vw - 40px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
